version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: queuesmart_postgres
    environment:
      POSTGRES_USER: queuesmart
      POSTGRES_PASSWORD: queuesmart123
      POSTGRES_DB: queuesmart
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U queuesmart"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: queuesmart_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: queuesmart_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: queuesmart_app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: production
      APP_PORT: 8080
      JWT_SECRET: super-secret-jwt-key-change-in-production
      JWT_ACCESS_EXPIRES: 15m
      JWT_REFRESH_EXPIRES: 168h
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: queuesmart
      DB_PASSWORD: queuesmart123
      DB_NAME: queuesmart
      DB_SSLMODE: disable
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      BASE_URL: http://localhost:8080
      FRONTEND_URL: http://localhost:3000
    ports:
      - "8080:8080"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: queuesmart_frontend
    depends_on:
      - app
    ports:
      - "3000:80"
    restart: unless-stopped

volumes:
  postgres_data:
